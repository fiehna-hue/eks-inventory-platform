apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: inventory
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: api
          image: 247906201098.dkr.ecr.us-east-1.amazonaws.com/inventory-api:d23abfd388581461b8642f93fb93435e79535ff5
          ports:
            - containerPort: 8000
          env:
            - name: DB_HOST
              value: db
          envFrom:
            - secretRef:
                name: inventory-db
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: inventory
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
