name: terraform-plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: envs/dev
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::247906201098:role/platform-eks-plan
          aws-region: us-east-1

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: |
          set -o pipefail
          terraform plan -input=false -lock=false -no-color 2>&1 | tee plan.txt

      - name: Comment the plan on the pull request
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fence = String.fromCharCode(96).repeat(3);
            let plan = fs.existsSync('envs/dev/plan.txt')
              ? fs.readFileSync('envs/dev/plan.txt', 'utf8')
              : 'No plan output was produced.';
            if (plan.length > 60000) plan = plan.slice(-60000);
            const body = '### Terraform plan (eks, dev)\n\n' + fence + '\n' + plan + '\n' + fence;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
